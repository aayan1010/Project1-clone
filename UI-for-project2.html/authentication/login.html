<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Nutritional Insights</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.0/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-100">
    <header class="bg-blue-600 p-4 text-white">
      <h1 class="text-3xl font-semibold">Nutritional Insights</h1>
    </header>

    <main class="container mx-auto p-6 flex justify-center">
      <div class="bg-white p-8 shadow-lg rounded-lg w-full max-w-md">
        <h2 class="text-2xl font-semibold mb-6">Log In</h2>

        <div id="messageBox" class="hidden mb-4 p-3 rounded text-sm"></div>

        <form id="loginForm" class="space-y-4">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700"
              >Email</label
            >
            <input
              id="email"
              type="email"
              required
              class="mt-1 p-2 border rounded w-full"
              autocomplete="email"
            />
          </div>

          <div>
            <label
              for="password"
              class="block text-sm font-medium text-gray-700"
              >Password</label
            >
            <input
              id="password"
              type="password"
              required
              class="mt-1 p-2 border rounded w-full"
              autocomplete="current-password"
            />
          </div>

          <button
            id="submitButton"
            type="submit"
            class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700"
          >
            Log In
          </button>
        </form>

        <div class="flex items-center my-4">
          <div class="flex-grow border-t border-gray-300"></div>
          <span class="mx-3 text-xs text-gray-500">OR</span>
          <div class="flex-grow border-t border-gray-300"></div>
        </div>

        <button
          id="githubLoginButton"
          type="button"
          class="w-full bg-gray-800 text-white p-2 rounded hover:bg-gray-900 flex items-center justify-center gap-2"
        >
          <svg
            class="w-5 h-5"
            viewBox="0 0 16 16"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
              0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
              -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07
              -1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82
              .64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12
              .51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
              0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
          Log In with GitHub
        </button>

        <p class="text-sm text-gray-600 mt-6 text-center">
          Don't have an account?
          <a
            href="register.html"
            class="text-blue-600 hover:underline font-medium"
            >Register here</a
          >
        </p>
      </div>
    </main>

    <script>
      // Relative URL — this page is served by the same Static Web App
      // that hosts the managed Function backend, so /api routes to it
      // automatically (no CORS, no hardcoded hostname).
      const API_BASE_URL = "/api";

      // Register this app's OAuth App on GitHub and paste its Client ID here.
      // The Client Secret stays server-side only (see AzureFunction/function_app.py).
      const GITHUB_CLIENT_ID = "Ov23liInvwZZ0tmdr4M7";

      const loginForm = document.getElementById("loginForm");
      const messageBox = document.getElementById("messageBox");
      const submitButton = document.getElementById("submitButton");
      const githubLoginButton = document.getElementById("githubLoginButton");

      function showMessage(text, isError) {
        messageBox.textContent = text;
        messageBox.classList.remove(
          "hidden",
          "bg-red-100",
          "text-red-700",
          "bg-green-100",
          "text-green-700"
        );
        messageBox.classList.add(
          isError ? "bg-red-100" : "bg-green-100",
          isError ? "text-red-700" : "text-green-700"
        );
      }

      function storeSession(data) {
        localStorage.setItem("authToken", data.token);
        localStorage.setItem("userEmail", data.email || "");
        localStorage.setItem("userName", data.name || "");
      }

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        submitButton.disabled = true;
        submitButton.textContent = "Logging in...";

        try {
          const response = await fetch(`${API_BASE_URL}/Login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();

          if (!response.ok) {
            showMessage(data.error || "Login failed.", true);
            return;
          }

          storeSession(data);
          showMessage("Logged in successfully. Redirecting...", false);

          setTimeout(() => {
            window.location.href = "../index.html";
          }, 1000);
        } catch (error) {
          showMessage("Network error. Please try again.", true);
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Log In";
        }
      });

      githubLoginButton.addEventListener("click", () => {
        const redirectUri = window.location.origin + window.location.pathname;
        const authorizeUrl = new URL("https://github.com/login/oauth/authorize");

        authorizeUrl.searchParams.set("client_id", GITHUB_CLIENT_ID);
        authorizeUrl.searchParams.set("redirect_uri", redirectUri);
        authorizeUrl.searchParams.set("scope", "user:email");

        window.location.href = authorizeUrl.toString();
      });

      // If GitHub just redirected back here with a `code`, exchange it for a JWT.
      async function handleGitHubCallback() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");

        if (!code) {
          return;
        }

        // Remove the `code` from the URL so a page refresh doesn't resend it.
        window.history.replaceState({}, document.title, window.location.pathname);

        showMessage("Completing GitHub login...", false);

        try {
          const response = await fetch(
            `${API_BASE_URL}/GitHubCallback?code=${encodeURIComponent(code)}`
          );

          const data = await response.json();

          if (!response.ok) {
            showMessage(data.error || "GitHub login failed.", true);
            return;
          }

          storeSession(data);
          showMessage("Logged in successfully. Redirecting...", false);

          setTimeout(() => {
            window.location.href = "../index.html";
          }, 1000);
        } catch (error) {
          showMessage("Network error. Please try again.", true);
        }
      }

      handleGitHubCallback();
    </script>
  </body>
</html>
